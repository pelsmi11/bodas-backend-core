spring:
  application:
    name: bodas-backend-core

  # Dynamic Database Configuration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  cloud:
    aws:
      region:
        static: ${AWS_REGION}
      s3:
        region: ${AWS_REGION}

# Cognito resource server: custom decoder + access-token claim validation
app:
  cognito:
    issuer-uri: ${COGNITO_ISSUER_URI}
    audience: ${COGNITO_APP_CLIENT_ID}
    region: ${AWS_REGION}

  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}

  redis:
    listener:
      enabled: true
  s3:
    bucket-name: ${S3_BUCKET_NAME}
    download-url-ttl: ${PHOTO_DOWNLOAD_URL_TTL:PT1H}
  photos:
    feed-limit: ${PHOTO_FEED_LIMIT:120}
    max-upload-size-bytes: ${PHOTO_MAX_UPLOAD_SIZE_BYTES:26214400}
  feed:
    heartbeat-ms: ${PHOTO_FEED_HEARTBEAT_MS:25000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://bodas.aws.pelsmi11.website}
  webhook:
    secret: ${moderation-webhook:${WEBHOOK_SECRET:}}

# Swagger / OpenAPI disabled by default; enabled in dev profile (application-dev.yml)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# /actuator/health/liveness is the ALB + Docker health check: public and
# independent of DB/Redis, so a dependency outage doesn't recycle every task.
management:
  endpoint:
    health:
      probes:
        enabled: true
